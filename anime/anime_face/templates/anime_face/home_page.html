                <img src="{% static 'anime15.jpg' %}" alt="">
            </div>

        </div>

        <div class="right-panel">

            <div class="content-wrapper">

                <div class="badge">
                    AI Powered GAN
                </div>

                <h1 class="hero-title">
                    Generate
                    <span class="gradient-text">
                        Anime Faces
                    </span>
                </h1>

                <p class="hero-description">
                    Create unique anime characters instantly using
                    Generative Adversarial Networks trained on anime
                    face datasets.
                </p>

                <div class="button-group">
                    <button id="generateBtn" class="generate-btn">
                        Generate Face
                    </button>
                </div>

                <div id="generatedBox" class="generated-box hidden relative">

                    <div id="loadingOverlay"
                        class="hidden absolute inset-0 flex-col items-center justify-center bg-slate-900/90 z-20 rounded-3xl">

                        <div class="loader"></div>

                        <p class="mt-4 text-white text-lg">
                            Creating Anime Face...
                        </p>

                        <div class="w-72 h-2 bg-slate-700 rounded-full overflow-hidden mt-4">
                            <div id="progressFill" class="h-full bg-white rounded-full" style="width:0%">
                            </div>
                        </div>

                    </div>

                    <img id="generatedImage" src="" class="generated-image" alt="Generated Anime Face">

                </div>


            </div>
        <div class="mt-10 text-center">

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}

                <button
                    type="submit"
                    class="text-gray-400 hover:text-white transition duration-300"
                >
                    Logout
                </button>

            </form>

        </div>          

        </div>







</body>

</html>

<script>
    const btn = document.getElementById("generateBtn");

    let generating = false;

    btn.addEventListener("click", async () => {

        if (generating) return;

        generating = true;

        const box = document.getElementById("generatedBox");
        const img = document.getElementById("generatedImage");
        const overlay = document.getElementById("loadingOverlay");
        const progress = document.getElementById("progressFill");

        box.classList.remove("hidden");

        overlay.classList.remove("hidden");
        overlay.style.display = "flex";

        img.style.opacity = "0";

        progress.style.width = "0%";

        btn.disabled = true;
        btn.textContent = "Generating...";

        let width = 0;

        const progressTimer = setInterval(() => {

            if (width < 95) {
                width += Math.random() * 4;
                progress.style.width = width + "%";
            }

        }, 250);

        try {

            const response = await fetch("/generate/");
            const data = await response.json();

            console.log("Generated:", data);

            const imageUrl =
                data.image_url + "?t=" + Date.now();

            const preload = new Image();

            preload.src = imageUrl;

            await preload.decode();

            clearInterval(progressTimer);

            progress.style.width = "100%";

            img.src = imageUrl;

            requestAnimationFrame(() => {
                img.style.opacity = "1";
            });

            overlay.style.display = "none";
            overlay.classList.add("hidden");

        }
        catch (err) {

            console.error(err);

            clearInterval(progressTimer);

            overlay.innerHTML = `
            <p class="text-red-400 text-center px-4">
                Failed to generate image
            </p>
        `;
        }
        finally {

            btn.disabled = false;
            btn.textContent = "Generate Face";

            generating = false;
        }

    });
</script>
