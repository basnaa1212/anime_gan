                            Creating Anime Face...
                        </p>

                            <div id="progressFill" class="h-full bg-white rounded-full" style="width:0%">

                    <div id="generatedBox" class="generated-box hidden relative">

                </div>

        </div>

    </div>

</html>

<script>
    const btn = document.getElementById("generateBtn");

    let generating = false;

    btn.addEventListener("click", async () => {

        if (generating) return;

        generating = true;

        const box = document.getElementById("generatedBox");
        const img = document.getElementById("generatedImage");
        const overlay = document.getElementById("loadingOverlay");
        const progress = document.getElementById("progressFill");

        box.classList.remove("hidden");

        // Show loader
        overlay.style.display = "flex";

        // Hide previous image while generating
        img.style.opacity = "0";

        // Reset progress
        progress.style.width = "0%";

        btn.disabled = true;
        btn.innerText = "Generating...";

        let width = 0;

        const progressTimer = setInterval(() => {

            if (width < 95) {
                width += Math.random() * 5;
                progress.style.width = width + "%";
            }

        }, 250);

        try {

            const response = await fetch("/generate/");

            const data = await response.json();

            console.log("Generated:", data);

            // Single URL used everywhere
            const imageUrl =
                data.image_url + "?t=" + Date.now();

            // Preload image
            await new Promise((resolve, reject) => {

                const preload = new Image();

                preload.onload = resolve;
                preload.onerror = reject;

                preload.src = imageUrl;

            });

            clearInterval(progressTimer);

            progress.style.width = "100%";

            // Give a small delay for smooth UX
            setTimeout(() => {

                img.onload = () => {

                    overlay.style.display = "none";

                    img.style.opacity = "1";

                    btn.disabled = false;
                    btn.innerText = "Generate Face";

                    generating = false;
                };

                img.onerror = () => {

                    console.error("Failed to display image");

                    overlay.innerHTML = `
                    <p class="text-red-400">
                        Failed to display image
                    </p>
                `;

                    btn.disabled = false;
                    btn.innerText = "Generate Face";

                    generating = false;
                };

                img.src = imageUrl;

            }, 300);

        }
        catch (err) {

            console.error(err);

            clearInterval(progressTimer);

            overlay.innerHTML = `
            <p class="text-red-400 text-lg">
                Failed to generate image
            </p>
        `;

            btn.disabled = false;
            btn.innerText = "Generate Face";

            generating = false;
        }

    });
</script>
