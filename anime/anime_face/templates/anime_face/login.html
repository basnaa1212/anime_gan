{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center">

    <div class="w-[340px] shadow-lg p-6 rounded-lg bg-gray-300">

        <!-- Login Title -->
        <h1 class="text-6xl font-light text-gray-600 mb-10">
            Login
        </h1>

        <form method="POST">
            {% csrf_token %}

            <!-- Username -->
            <div class="flex border border-white-600 bg-white mb-5 h-12">

                <div class="w-12 bg-gray-100 flex items-center justify-center border-r border-gray-300">

                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"
                        class="w-5 h-5 text-gray-600">
                        <path
                            d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5zm0 2c-3.314 0-6 2.686-6 6h12c0-3.314-2.686-6-6-6z" />
                    </svg>

                </div>

                {{ form.username }}

            </div>

            <!-- Password -->
            <div class="flex border border-gray-300 bg-white mb-5 h-12">

                <div class="w-12 bg-gray-100 flex items-center justify-center border-r border-gray-300">

                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"
                        class="w-5 h-5 text-gray-600">
                        <path
                            d="M17 8h-1V6a4 4 0 10-8 0v2H7a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2V10a2 2 0 00-2-2zm-7-2a2 2 0 114 0v2h-4V6zm2 9a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" />
                    </svg>

                </div>

                {{ form.password }}

            </div>

            {% if form.errors %}
            <div class="text-red-500 text-sm mb-4">
                Invalid username or password.
            </div>
            {% endif %}

            <div class="text-xs text-gray-500 mb-8">

                <label class="flex items-center gap-2 mb-2">
                    <span>Remember me</span>
                    <input type="checkbox" name="remember">
                </label>

                <a href="" class="hover:text-blue-500">
                    Forgot your password?
                </a>

            </div>

            <button type="submit"
                class="w-full h-12 bg-gradient-to-b from-gray-400 to-black-600 text-white text-xl tracking-wide hover:opacity-90 transition">

                LOGIN

            </button>

        </form>

    </div>

</body>

</html>
